name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Fast tests without media tools
        run: >-
          python -m pytest -q tests/test_image_statistics.py tests/test_screen_cache.py
          tests/test_updates.py tests/test_cli.py::test_module_entry_point
          tests/test_language_switch.py::test_catalog_has_complete_english_and_preserves_template_fields
